name: Release

# Tag push builds and attaches installers to the matching GitHub release.
# workflow_dispatch builds the same artifacts and uploads them WITHOUT touching
# any release, so the pipeline can be exercised without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      # One platform failing must not discard the two that worked — a macOS
      # signing hiccup should not cost the Windows and Linux installers.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            pattern: 'apps/desktop/release/*.exe'
          - os: macos-latest
            artifact: macos
            pattern: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - os: ubuntu-latest
            artifact: linux
            pattern: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Never ship an installer built from code that does not typecheck or
      # pass its tests. CI runs these on push too, but a tag can point at any
      # commit, including one that never went through a push build.
      - run: npm run type-check
      - run: npm test

      - name: Build installers
        env:
          # These builds are UNSIGNED. Without this, electron-builder hunts for
          # a keychain identity on macOS and fails the job rather than falling
          # back. Signing needs an Apple Developer cert and a Windows OV/EV
          # cert; until those exist, unsigned-and-honest beats a red pipeline.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build --workspace evolution2

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: lineage-${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 14

  # Only on a tag. workflow_dispatch stops at the artifacts above.
  attach:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
            -o -name '*.AppImage' -o -name '*.deb' \) -print0 \
            | xargs -0 gh release upload "${GITHUB_REF_NAME}" --clobber
