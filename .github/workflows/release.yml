name: Release

# Tag push builds and attaches installers to the matching GitHub release.
# workflow_dispatch builds the same artifacts and uploads them WITHOUT touching
# any release, so the pipeline can be exercised without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      # One platform failing must not discard the two that worked — a macOS
      # signing hiccup should not cost the Windows and Linux installers.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write        # required to sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # electron-builder shells out to a bundled 7-Zip. On the Linux and macOS
      # runners `npm ci` left node_modules/7zip-bin/<platform>/ empty and the
      # build died with `ENOENT: chmod .../7za` — the binaries are present after
      # a plain install, so the lockfile-strict path is dropping them. Repair it
      # here rather than abandoning `npm ci` for the whole job, and print the
      # directory so a future failure names itself instead of needing a rerun.
      - name: Ensure electron-builder's 7-Zip binary is present
        shell: bash
        run: |
          probe() { node -e "
            const {path7za} = require('7zip-bin');
            const fs = require('fs');
            console.log('7za path:', path7za, 'exists:', fs.existsSync(path7za));
            process.exit(fs.existsSync(path7za) ? 0 : 1);
          "; }
          if ! probe; then
            echo "::warning::7zip-bin binary missing after npm ci — reinstalling it"
            npm install 7zip-bin --no-save --force
            probe
          fi

      # Never ship an installer built from code that does not typecheck or
      # pass its tests. CI runs these on push too, but a tag can point at any
      # commit, including one that never went through a push build.
      - run: npm run type-check

      - run: npm test

      # Signing turns itself on the moment the certificates exist as repository
      # secrets — no workflow edit, no rebuild of this file. Until then the
      # builds are unsigned and say so, which beats a red pipeline or a silently
      # unsigned artifact that claims otherwise. See docs/signing.md.
      - name: Decide whether this build can be signed
        id: signing
        shell: bash
        env:
          WIN_CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
          MAC_CERT: ${{ secrets.MACOS_CERT_BASE64 }}
        run: |
          case "${{ matrix.artifact }}" in
            windows) [ -n "$WIN_CERT" ] && echo "signed=true" >> "$GITHUB_OUTPUT" || echo "signed=false" >> "$GITHUB_OUTPUT" ;;
            macos)   [ -n "$MAC_CERT" ] && echo "signed=true" >> "$GITHUB_OUTPUT" || echo "signed=false" >> "$GITHUB_OUTPUT" ;;
            *)       echo "signed=false" >> "$GITHUB_OUTPUT" ;;   # Linux packages are not code-signed
          esac

      - name: Build installers
        env:
          # electron-builder reads CSC_LINK (base64 .pfx / .p12) and
          # CSC_KEY_PASSWORD directly. Empty means unsigned.
          CSC_LINK: ${{ matrix.artifact == 'windows' && secrets.WINDOWS_CERT_BASE64 || matrix.artifact == 'macos' && secrets.MACOS_CERT_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.artifact == 'windows' && secrets.WINDOWS_CERT_PASSWORD || matrix.artifact == 'macos' && secrets.MACOS_CERT_PASSWORD || '' }}
          # Without a certificate this MUST stay false: otherwise electron-builder
          # hunts for a keychain identity on macOS and fails the job instead of
          # falling back to an unsigned build.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.signed }}
          # Notarisation. Apple staples a ticket only when all three are present;
          # absent, the .dmg is signed but still shows a Gatekeeper prompt.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          # electron-builder treats an EMPTY CSC_LINK as "a certificate was
          # configured", then tries to resolve it as a path and dies with
          # "Env WIN_CSC_LINK is not correct, cannot resolve". These have to be
          # ABSENT, not blank — and GitHub Actions cannot conditionally omit an
          # env key, so they are unset here instead.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          echo "signing enabled: ${{ steps.signing.outputs.signed }}"
          npm run build --workspace evolution2

      # A checksum is the verification that costs nothing and works today: it
      # proves the file survived the network intact, which is exactly the failure
      # already seen once here — an asset that uploaded corrupt and 404'd while
      # its neighbours were fine.
      - name: Checksums
        shell: bash
        run: |
          cd apps/desktop/release
          shopt -s nullglob
          files=(*.exe *.dmg *.zip *.AppImage *.deb)
          [ ${#files[@]} -gt 0 ] || { echo "no artifacts to checksum"; exit 1; }
          sha256sum "${files[@]}" | tee "SHA256SUMS-${{ matrix.artifact }}.txt"

      # Cryptographic provenance: proves these exact bytes were built by this
      # workflow, from this commit, on GitHub's runners. Free, and verifiable by
      # anyone with `gh attestation verify <file> --repo darktw1nk/Lineage`.
      # NOT a substitute for code signing — it does not quiet SmartScreen or
      # Gatekeeper — but it is real supply-chain evidence that exists today.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: lineage-${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  # Only on a tag. workflow_dispatch stops at the artifacts above.
  attach:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name 'SHA256SUMS-*.txt' \) -print0 \
            | xargs -0 gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber
